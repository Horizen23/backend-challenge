services:
  redis:
    image: redis:7-alpine
    container_name: lottery-poc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  lottery-poc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lottery-poc-runner
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
